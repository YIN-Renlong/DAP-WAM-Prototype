        function WAMBuilder() {
            const [activeDomain, setActiveDomain] = useState('cs');
            const [activePreset, setActivePreset] = useState('tier3');
            const [rows, setRows] = useState(deepClone(profiles.cs.presets.tier3.data));
            const [showStressTests, setShowStressTests] = useState(false);

            const profile = profiles[activeDomain];

            const switchDomain = (domainKey) => {
                setActiveDomain(domainKey);
                setActivePreset('tier3');
                setRows(deepClone(profiles[domainKey].presets.tier3.data));
                setShowStressTests(false);
            };

            const applyPreset = (presetKey, isStressTest = false) => {
                const sourceData = isStressTest
                    ? profile.stressTests[presetKey].data
                    : profile.presets[presetKey].data;

                setActivePreset(isStressTest ? `stress-${presetKey}` : presetKey);
                setRows(deepClone(sourceData));
            };

            const updateRow = (id, field, value) => {
                setRows(rows.map(row => row.id === id ? { ...row, [field]: value } : row));
            };

            const makeIssue = (severity, title, message) => ({
                severity,
                title,
                message
            });

            const getRowIssues = (row) => {
                let issues = [];

                const weight = Number(row.weight);
                const compLower = row.component.toLowerCase();

                const isAIPermitted =
                    row.tooling === 'AI Allowed' ||
                    row.tooling === 'Hybrid / Co-Pilot';

                const isWeakEvidence =
                    row.evidence.includes('E1') ||
                    row.evidence.includes('AI-use label');

                const isStrongEvidence =
                    row.evidence.includes('E3') ||
                    row.evidence.includes('E4');

                // Universal rule: high weight + AI + weak evidence
                if (weight >= 25 && isAIPermitted && isWeakEvidence) {
                    issues.push(makeIssue(
                        'error',
                        'Integrity Error',
                        'This task is worth many points and AI is allowed, but the required evidence is weak. Ask for process evidence, explanation evidence, or a live check.'
                    ));
                }

                // Universal rule: low weight + heavy evidence
                if (weight <= 10 && isStrongEvidence) {
                    issues.push(makeIssue(
                        'warning',
                        'Proportionality Warning',
                        'This task is worth few points, but it asks for heavy evidence such as a long explanation or live check. This may create too much work for a small part of the grade.'
                    ));
                }

                if (activeDomain === 'cs') {
                    if (
                        (compLower.includes('syntax') || compLower.includes('boilerplate')) &&
                        weight > 20 &&
                        isAIPermitted
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Pedagogy Warning',
                            'This gives many points for syntax or boilerplate while AI is allowed. The grade may reward AI-generated routine code more than the student’s own understanding.'
                        ));
                    }

                    if (
                        compLower.includes('architecture') &&
                        row.granularity === 'Line-Level'
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Granularity Warning',
                            'System architecture is a big-picture task. Asking for line-by-line disclosure is too detailed. Use diagram-level or assignment-level evidence instead.'
                        ));
                    }
                }

                if (activeDomain === 'bio') {
                    const isBackground =
                        compLower.includes('background') ||
                        compLower.includes('hypothesis');

                    const isExperimentalDesign =
                        compLower.includes('experimental design') ||
                        compLower.includes('variables') ||
                        compLower.includes('controls');

                    const isDataCollection =
                        compLower.includes('data collection') ||
                        compLower.includes('lab notebook') ||
                        compLower.includes('raw observations');

                    const isDataAnalysis =
                        compLower.includes('data analysis') ||
                        compLower.includes('statistics') ||
                        compLower.includes('figures');

                    const isDiscussion =
                        compLower.includes('discussion') ||
                        compLower.includes('limitations') ||
                        compLower.includes('scientific argument');

                    if (
                        isBackground &&
                        isAIPermitted &&
                        isWeakEvidence &&
                        weight >= 10
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Source Quality Warning',
                            'AI can produce plausible but unreliable biological background text or citations. Ask for an annotated source list, search log, or explanation of why the sources are relevant.'
                        ));
                    }

                    if (
                        isExperimentalDesign &&
                        isAIPermitted &&
                        isWeakEvidence
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Experimental Design Warning',
                            'Experimental design requires justification of variables, controls, and confounders. A final answer alone is weak evidence when AI support is allowed.'
                        ));
                    }

                    if (
                        (isDataCollection || isDataAnalysis) &&
                        isWeakEvidence &&
                        weight >= 15
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Data Integrity Warning',
                            'Final graphs or final tables alone are not enough for important data work. Ask for raw data, lab notebook notes, spreadsheet formulas, analysis files, or explanation of excluded data.'
                        ));
                    }

                    if (
                        isDataCollection &&
                        row.tooling === 'AI Allowed'
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Observation Authenticity Warning',
                            'For lab observations or raw measurements, AI should not replace the student’s direct observation. If AI is allowed, clarify that it may only assist with formatting, transcription, or reflection.'
                        ));
                    }

                    if (
                        (isDataCollection || isDataAnalysis) &&
                        row.granularity === 'Whole-Report Level'
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Granularity Warning',
                            'Data work needs more specific evidence than whole-report-level disclosure. Use observation-level, protocol-step-level, or figure/table-level evidence.'
                        ));
                    }

                    if (
                        (isBackground || isExperimentalDesign || isDiscussion) &&
                        row.granularity === 'Observation/Data-Point Level'
                    ) {
                        issues.push(makeIssue(
                            'warning',
                            'Granularity Warning',
                            'This is a big-picture reasoning task. Data-point-level disclosure is too microscopic. Use source-level, protocol-step-level, section-level, or claim-level evidence instead.'
                        ));
                    }
                }

                return issues;
            };

            const totalWeight = rows.reduce((sum, row) => sum + Number(row.weight || 0), 0);
            const allIssues = rows.flatMap(row => getRowIssues(row));
            const blockingIssueCount = allIssues.filter(issue => issue.severity === 'error').length;
            const advisoryIssueCount = allIssues.filter(issue => issue.severity === 'warning').length;
            const canPublish = totalWeight === 100 && blockingIssueCount === 0;

            const getStatusText = () => {
                if (totalWeight !== 100) return 'Fix total weight';
                if (blockingIssueCount > 0) return 'Blocking issue found';
                if (advisoryIssueCount > 0) return 'Publishable with warnings';
                return 'Matrix valid';
            };

            const getStatusClass = () => {
                if (totalWeight !== 100 || blockingIssueCount > 0) {
                    return 'bg-gray-600 cursor-not-allowed opacity-60';
                }
                if (advisoryIssueCount > 0) {
                    return 'bg-amber-600 hover:bg-amber-500';
                }
                return 'bg-blue-600 hover:bg-blue-500';
            };

            return (
                <div className="w-full max-w-[1900px] mx-auto bg-white p-5 rounded-lg shadow-xl">
                    {/* Header */}
                    <div className="border-b pb-4 mb-5">
                        <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                            <div>
                                <h1 className="text-3xl font-extrabold text-gray-900 tracking-tight mb-1">
                                    Dynamic Assessment Protocol (DAP)
                                </h1>
                                <p className="text-gray-600 text-base">
                                    Instructor Matrix Builder: align permitted AI tooling with evidence and grading weight.
                                </p>
                            </div>

                            <div className="bg-blue-50 border border-blue-200 text-blue-800 text-xs font-bold px-3 py-2 rounded-full">
                                {profile.badge}
                            </div>
                        </div>
                    </div>

                    {/* Assessment Context Selector */}
                    <div className="mb-5 bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <h2 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">
                            1. Choose assessment context
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {Object.keys(profiles).map(key => (
                                <button
                                    key={key}
                                    onClick={() => switchDomain(key)}
                                    className={`p-3 rounded-md text-left transition-all border-2 ${
                                        activeDomain === key
                                            ? 'border-blue-600 bg-white shadow-sm'
                                            : 'border-transparent bg-white shadow-sm hover:border-blue-300'
                                    }`}
                                >
                                    <div className="font-bold text-blue-700 text-sm wrap-text">
                                        {profiles[key].label}
                                    </div>
                                    <div className="text-xs text-gray-600 mt-1 wrap-text">
                                        {profiles[key].desc}
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Quick Guide */}
                    <div className="mb-5 bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <h2 className="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">
                            Quick guide
                        </h2>

                        <p className="text-sm text-gray-700 leading-relaxed wrap-text">
                            Current context: <span className="font-bold">{profile.label}</span>. {profile.componentModel}
                            Evidence means proof that the student understands the submitted work. Weak evidence is only the final output
                            or an AI-use label alone. Stronger evidence can include process notes, tests, explanations, lab records,
                            data files, or a short oral check.
                        </p>
                    </div>

                    {/* Valid Presets */}
                    <div className="mb-5 bg-blue-50 p-4 rounded-lg border border-blue-200">
                        <h2 className="text-sm font-bold text-blue-800 uppercase tracking-wider mb-3">
                            2. Choose a valid assessment preset
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                            {Object.keys(profile.presets).map(key => (
                                <button
                                    key={key}
                                    onClick={() => applyPreset(key, false)}
                                    className={`p-3 rounded-md text-left transition-all border-2 ${
                                        activePreset === key
                                            ? 'border-blue-600 bg-white shadow-sm'
                                            : 'border-transparent bg-white shadow-sm hover:border-blue-300'
                                    }`}
                                >
                                    <div className="font-bold text-blue-700 text-sm wrap-text">
                                        {profile.presets[key].name}
                                    </div>
                                    <div className="text-xs text-gray-600 mt-1 leading-tight wrap-text">
                                        {profile.presets[key].desc}
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Matrix */}
                    <div className="mb-3 flex flex-col md:flex-row md:justify-between md:items-end gap-2">
                        <div>
                            <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wider">
                                3. Live logic matrix
                            </h2>
                        </div>

                        <div className="flex flex-wrap gap-2">
                            <span className="text-xs text-blue-600 font-semibold bg-blue-100 px-2 py-1 rounded">
                                Logic Engine Active
                            </span>
                            <span className="text-xs text-gray-700 font-semibold bg-gray-100 px-2 py-1 rounded">
                                {profile.shortLabel}
                            </span>
                        </div>
                    </div>

                    <div className="border border-gray-200 rounded-lg shadow-sm overflow-hidden mb-5">
                        <table className="matrix-table text-left border-collapse">
                            <colgroup>
                                <col style={{ width: '23%' }} />
                                <col style={{ width: '12%' }} />
                                <col style={{ width: '15%' }} />
                                <col style={{ width: '16%' }} />
                                <col style={{ width: '7%' }} />
                                <col style={{ width: '27%' }} />
                            </colgroup>

                            <thead>
                                <tr className="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
                                    <th className="p-3 border-b">Component of Work</th>
                                    <th className="p-3 border-b">Tooling</th>
                                    <th className="p-3 border-b">Granularity</th>
                                    <th className="p-3 border-b">Evidence Required</th>
                                    <th className="p-3 border-b text-center">Weight</th>
                                    <th className="p-3 border-b">System Feedback</th>
                                </tr>
                            </thead>

                            <tbody className="bg-white">
                                {rows.map((row) => {
                                    const issues = getRowIssues(row);
                                    const hasError = issues.some(issue => issue.severity === 'error');
                                    const hasWarning = issues.some(issue => issue.severity === 'warning');

                                    const rowBg = hasError
                                        ? 'bg-red-50/40'
                                        : hasWarning
                                            ? 'bg-amber-50/40'
                                            : 'hover:bg-blue-50/40';

                                    return (
                                        <tr key={row.id} className={`border-b ${rowBg}`}>
                                            {/* Component */}
                                            <td className="p-3 border-r border-gray-100">
                                                <div className="w-full p-2 rounded-md border border-gray-200 bg-gray-50 text-sm font-semibold text-gray-900 leading-snug wrap-text">
                                                    {row.component}
                                                </div>
                                            </td>

                                            {/* Tooling */}
                                            <td className="p-3 border-r border-gray-100">
                                                <select
                                                    value={row.tooling}
                                                    onChange={(e) => updateRow(row.id, 'tooling', e.target.value)}
                                                    className="compact-select w-full p-2 border border-gray-300 rounded-md text-sm bg-white"
                                                >
                                                    {toolingOptions.map(opt => (
                                                        <option key={opt}>{opt}</option>
                                                    ))}
                                                </select>
                                            </td>

                                            {/* Granularity */}
                                            <td className="p-3 border-r border-gray-100">
                                                <select
                                                    value={row.granularity}
                                                    onChange={(e) => updateRow(row.id, 'granularity', e.target.value)}
                                                    className="compact-select w-full p-2 border border-gray-300 rounded-md text-sm bg-white"
                                                >
                                                    {profile.granularityOptions.map(opt => (
                                                        <option key={opt}>{opt}</option>
                                                    ))}
                                                </select>
                                            </td>

                                            {/* Evidence */}
                                            <td className="p-3 border-r border-gray-100">
                                                <select
                                                    value={row.evidence}
                                                    onChange={(e) => updateRow(row.id, 'evidence', e.target.value)}
                                                    className="compact-select w-full p-2 border border-gray-300 rounded-md text-sm bg-white"
                                                >
                                                    {evidenceOptions.map(opt => (
                                                        <option key={opt}>{opt}</option>
                                                    ))}
                                                </select>
                                            </td>

                                            {/* Weight */}
                                            <td className="p-3 border-r border-gray-100">
                                                <div className="flex items-center gap-1">
                                                    <input
                                                        type="number"
                                                        min="0"
                                                        max="100"
                                                        step="5"
                                                        value={row.weight}
                                                        onChange={(e) => updateRow(row.id, 'weight', e.target.value)}
                                                        className="compact-input w-full p-2 border border-gray-300 rounded-md text-center font-bold text-sm bg-white"
                                                    />
                                                    <span className="text-xs font-bold text-gray-500">%</span>
                                                </div>
                                            </td>

                                            {/* Feedback */}
                                            <td className="p-3">
                                                {issues.length === 0 ? (
                                                    <div className="inline-flex items-start gap-2 text-green-700 font-semibold text-sm bg-green-50 border border-green-200 px-3 py-2 rounded-md wrap-text">
                                                        <span className="font-bold">✓</span>
                                                        <span>Valid alignment</span>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-2">
                                                        {issues.map((issue, i) => (
                                                            <div
                                                                key={i}
                                                                className={`p-2 rounded-md border text-sm leading-snug wrap-text ${
                                                                    issue.severity === 'error'
                                                                        ? 'bg-red-50 border-red-200 text-red-800'
                                                                        : 'bg-amber-50 border-amber-200 text-amber-900'
                                                                }`}
                                                            >
                                                                <div className="font-bold mb-1">
                                                                    {issue.severity === 'error' ? '⛔ ' : '⚠️ '}
                                                                    {issue.title}
                                                                </div>
                                                                <div>
                                                                    {issue.message}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Total Weight */}
                    <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-3 bg-gray-800 p-4 rounded-lg shadow-inner mb-5">
                        <div>
                            <div className="text-lg font-bold text-white">
                                Total Assessment Weight:
                                <span className={totalWeight === 100 ? "text-green-400 ml-2" : "text-red-400 ml-2"}>
                                    {totalWeight}%
                                </span>
                            </div>

                            <div className="text-xs text-gray-300 mt-1">
                                Blocking errors: <span className="font-bold text-red-300">{blockingIssueCount}</span>
                                <span className="mx-2">|</span>
                                Advisory warnings: <span className="font-bold text-amber-300">{advisoryIssueCount}</span>
                            </div>
                        </div>

                        <button
                            disabled={!canPublish}
                            className={`px-6 py-2 rounded-md text-white font-bold transition-all ${getStatusClass()}`}
                        >
                            {getStatusText()}
                        </button>
                    </div>

                    {/* Stress Tests */}
                    <div className="bg-red-50 p-4 rounded-lg border border-red-200">
                        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                            <div>
                                <h2 className="text-sm font-bold text-red-800 uppercase tracking-wider">
                                    Optional: logic stress tests
                                </h2>
                                <p className="text-xs text-red-700 mt-1">
                                    These presets intentionally inject problematic configurations.
                                </p>
                            </div>

                            <button
                                onClick={() => setShowStressTests(!showStressTests)}
                                className="px-4 py-2 bg-red-700 text-white text-sm font-bold rounded-md hover:bg-red-800 transition self-start md:self-auto"
                                aria-expanded={showStressTests}
                            >
                                {showStressTests ? 'Hide stress tests' : 'Show stress tests'}
                            </button>
                        </div>

                        {showStressTests && (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mt-4">
                                {Object.keys(profile.stressTests).map(key => (
                                    <button
                                        key={key}
                                        onClick={() => applyPreset(key, true)}
                                        className={`p-3 rounded-md text-left transition-all border-2 ${
                                            activePreset === `stress-${key}`
                                                ? 'border-red-600 bg-white shadow-sm'
                                                : 'border-red-100 bg-white shadow-sm hover:border-red-400'
                                        }`}
                                    >
                                        <div className="font-bold text-red-700 text-sm wrap-text">
                                            {profile.stressTests[key].name}
                                        </div>

                                        <div className="text-xs text-gray-600 mt-1 leading-tight wrap-text">
                                            {profile.stressTests[key].desc}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WAMBuilder />);
    </script>
</body>
</html>
