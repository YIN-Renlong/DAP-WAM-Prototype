cat > dap-prototype.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAP WAM Builder Prototype</title>

    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        /*
          For the usability study, all presets keep the same five components.
          This makes the matrix easier to compare because only tooling,
          evidence, granularity, and weight change across presets.
        */

        // --- VALID PRESETS (Tiers 1-4) ---
        const presets = {
            tier1: {
                name: "Tier 1: Foundational",
                desc: "AI prohibited. Emphasis on manual production and basic understanding.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E2 (Moderate)', weight: 10 },
                    { id: 2, component: 'Core Logic', tooling: 'Student Only', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 35 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'Student Only', granularity: 'Line-Level', evidence: 'E1 (Weak)', weight: 35 },
                    { id: 4, component: 'Documentation', tooling: 'Student Only', granularity: 'File-Level', evidence: 'E1 (Weak)', weight: 10 },
                    { id: 5, component: 'Debugging', tooling: 'Student Only', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 10 }
                ]
            },

            tier2: {
                name: "Tier 2: Hybrid",
                desc: "AI as assistant. Some AI support is allowed with moderate evidence.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E2 (Moderate)', weight: 20 },
                    { id: 2, component: 'Core Logic', tooling: 'Student Only', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 30 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'Hybrid / Co-Pilot', granularity: 'File-Level', evidence: 'E1 (Weak)', weight: 15 },
                    { id: 4, component: 'Documentation', tooling: 'AI Allowed', granularity: 'Assignment-Level', evidence: 'Provenance Label (Y/N)', weight: 10 },
                    { id: 5, component: 'Debugging', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 25 }
                ]
            },

            tier3: {
                name: "Tier 3: Architectural",
                desc: "AI as implementer. Emphasis shifts toward verification and design reasoning.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E3 (Strong)', weight: 40 },
                    { id: 2, component: 'Core Logic', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 30 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'AI Allowed', granularity: 'File-Level', evidence: 'E1 (Weak)', weight: 10 },
                    { id: 4, component: 'Documentation', tooling: 'AI Allowed', granularity: 'Assignment-Level', evidence: 'Provenance Label (Y/N)', weight: 5 },
                    { id: 5, component: 'Debugging', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 15 }
                ]
            },

            tier4: {
                name: "Tier 4: Frontier",
                desc: "AI is expected. Assessment focuses on added value, verification, and judgment.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E4 (Live Contextual)', weight: 30 },
                    { id: 2, component: 'Core Logic', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E3 (Strong)', weight: 30 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'AI Allowed', granularity: 'File-Level', evidence: 'E1 (Weak)', weight: 5 },
                    { id: 4, component: 'Documentation', tooling: 'AI Allowed', granularity: 'Assignment-Level', evidence: 'Provenance Label (Y/N)', weight: 5 },
                    { id: 5, component: 'Debugging', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E3 (Strong)', weight: 30 }
                ]
            }
        };

        // --- ANTI-PATTERN PRESETS ---
        // These are hidden by default and used only for stress-testing the logic engine.
        const errorCases = {
            err1: {
                name: "Anti-Pattern 1: Free-Rider",
                desc: "High weight + AI allowed + weak evidence.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E2 (Moderate)', weight: 20 },
                    { id: 2, component: 'Core Logic', tooling: 'AI Allowed', granularity: 'Function-Level', evidence: 'E1 (Weak)', weight: 30 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'AI Allowed', granularity: 'File-Level', evidence: 'E1 (Weak)', weight: 10 },
                    { id: 4, component: 'Documentation', tooling: 'AI Allowed', granularity: 'Assignment-Level', evidence: 'Provenance Label (Y/N)', weight: 10 },
                    { id: 5, component: 'Debugging', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 30 }
                ]
            },

            err2: {
                name: "Anti-Pattern 2: Surveillance Trap",
                desc: "Low-weight task demanding excessive evidence.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E2 (Moderate)', weight: 25 },
                    { id: 2, component: 'Core Logic', tooling: 'Student Only', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 35 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'Student Only', granularity: 'Line-Level', evidence: 'E1 (Weak)', weight: 15 },
                    { id: 4, component: 'Documentation', tooling: 'Student Only', granularity: 'Assignment-Level', evidence: 'E4 (Live Contextual)', weight: 5 },
                    { id: 5, component: 'Debugging', tooling: 'Student Only', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 20 }
                ]
            },

            err3: {
                name: "Anti-Pattern 3: Labor Misalignment",
                desc: "Too much credit for syntax when AI is allowed.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Student Only', granularity: 'Diagram-Level', evidence: 'E3 (Strong)', weight: 25 },
                    { id: 2, component: 'Core Logic', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 25 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'AI Allowed', granularity: 'File-Level', evidence: 'E2 (Moderate)', weight: 25 },
                    { id: 4, component: 'Documentation', tooling: 'AI Allowed', granularity: 'Assignment-Level', evidence: 'Provenance Label (Y/N)', weight: 5 },
                    { id: 5, component: 'Debugging', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 20 }
                ]
            },

            err4: {
                name: "Anti-Pattern 4: Granularity Mismatch",
                desc: "Line-level disclosure for a macro-level architecture task.",
                data: [
                    { id: 1, component: 'System Architecture', tooling: 'Hybrid / Co-Pilot', granularity: 'Line-Level', evidence: 'E3 (Strong)', weight: 30 },
                    { id: 2, component: 'Core Logic', tooling: 'Student Only', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 30 },
                    { id: 3, component: 'Syntax/Boilerplate', tooling: 'AI Allowed', granularity: 'File-Level', evidence: 'E1 (Weak)', weight: 10 },
                    { id: 4, component: 'Documentation', tooling: 'AI Allowed', granularity: 'Assignment-Level', evidence: 'Provenance Label (Y/N)', weight: 5 },
                    { id: 5, component: 'Debugging', tooling: 'Hybrid / Co-Pilot', granularity: 'Function-Level', evidence: 'E2 (Moderate)', weight: 25 }
                ]
            }
        };

        function WAMBuilder() {
            const [activePreset, setActivePreset] = useState('tier3');
            const [rows, setRows] = useState(JSON.parse(JSON.stringify(presets.tier3.data)));
            const [showStressTests, setShowStressTests] = useState(false);

            const toolingOptions = ['Student Only', 'Hybrid / Co-Pilot', 'AI Allowed'];
            const evidenceOptions = ['E1 (Weak)', 'E2 (Moderate)', 'E3 (Strong)', 'E4 (Live Contextual)', 'Provenance Label (Y/N)'];
            const granularityOptions = ['Assignment-Level', 'File-Level', 'Diagram-Level', 'Function-Level', 'Line-Level'];

            const updateRow = (id, field, value) => {
                setRows(rows.map(row => row.id === id ? { ...row, [field]: value } : row));
            };

            const applyPreset = (presetKey, isErrorCase = false) => {
                const sourceData = isErrorCase ? errorCases[presetKey].data : presets[presetKey].data;
                setActivePreset(isErrorCase ? `error-${presetKey}` : presetKey);
                setRows(JSON.parse(JSON.stringify(sourceData)));
            };

            // --- THE 4 GEARS: THE LOGIC ENGINE ---
            const getRowErrors = (row) => {
                let errors = [];

                const weight = Number(row.weight);
                const isAIPermitted = row.tooling === 'AI Allowed' || row.tooling === 'Hybrid / Co-Pilot';
                const isWeakEvidence = row.evidence.includes('E1') || row.evidence.includes('Provenance');
                const isStrongEvidence = row.evidence.includes('E3') || row.evidence.includes('E4');
                const compLower = row.component.toLowerCase();

                // Gear 1: Integrity
                if (weight >= 25 && isAIPermitted && isWeakEvidence) {
                    errors.push("Integrity Warning: high-weight tasks using AI should require at least E2 evidence, so that students provide more than a final output.");
                }

                // Gear 2: Usability / proportionality
                if (weight <= 10 && isStrongEvidence) {
                    errors.push("Proportionality Warning: strong evidence for a low-weight task may create unnecessary workload. Consider E1 or E2.");
                }

                // Gear 3: Pedagogical alignment
                if ((compLower.includes('syntax') || compLower.includes('boilerplate')) && weight > 20 && isAIPermitted) {
                    errors.push("Pedagogy Warning: if syntax or boilerplate receives high weight, allowing AI may shift credit away from the student's own work.");
                }

                // Gear 4: Disclosure granularity
                if (compLower.includes('architecture') && row.granularity === 'Line-Level') {
                    errors.push("Granularity Warning: line-level disclosure is too detailed for a system architecture task. Diagram-level or component-level evidence is more appropriate.");
                }

                return errors;
            };

            const totalWeight = rows.reduce((sum, row) => sum + Number(row.weight), 0);
            const hasErrors = rows.some(row => getRowErrors(row).length > 0);
            const canPublish = totalWeight === 100 && !hasErrors;

            return (
                <div className="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow-xl">
                    <div className="border-b pb-4 mb-6">
                        <h1 className="text-3xl font-extrabold text-gray-900 tracking-tight mb-2">
                            Dynamic Assessment Protocol (DAP)
                        </h1>
                        <p className="text-gray-600 text-lg">
                            Instructor Matrix Builder: align permitted AI tooling with evidence and grading weight.
                        </p>
                    </div>

                    {/* Short participant guide */}
                    <div className="mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <h2 className="text-sm font-bold text-gray-700 uppercase tracking-wider mb-2">
                            Quick guide for this test
                        </h2>
                        <p className="text-sm text-gray-700 leading-relaxed">
                            This table always uses the same five assignment components: System Architecture,
                            Core Logic, Syntax/Boilerplate, Documentation, and Debugging. The presets change the
                            AI policy, evidence level, disclosure granularity, and grading weight. A warning means
                            that the current configuration may be inconsistent, disproportionate, or difficult to justify.
                        </p>
                    </div>

                    {/* Valid Presets */}
                    <div className="mb-6 bg-blue-50 p-4 rounded-lg border border-blue-200">
                        <h2 className="text-sm font-bold text-blue-800 uppercase tracking-wider mb-3">
                            1. Choose a valid assessment preset
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            {Object.keys(presets).map(key => (
                                <button
                                    key={key}
                                    onClick={() => applyPreset(key, false)}
                                    className={`p-3 rounded-md text-left transition-all duration-200 border-2 ${
                                        activePreset === key
                                            ? 'border-blue-600 bg-white shadow-md'
                                            : 'border-transparent bg-white shadow hover:border-blue-300'
                                    }`}
                                >
                                    <div className="font-bold text-blue-700 text-sm">
                                        {presets[key].name}
                                    </div>
                                    <div className="text-xs text-gray-600 mt-1 leading-tight">
                                        {presets[key].desc}
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Matrix Editor UI */}
                    <div className="mb-4 flex justify-between items-end">
                        <h2 className="text-sm font-bold text-gray-500 uppercase tracking-wider">
                            2. Live logic matrix
                        </h2>
                        <span className="text-xs text-blue-600 font-semibold bg-blue-100 px-2 py-1 rounded animate-pulse">
                            Logic Engine Active
                        </span>
                    </div>

                    <div className="overflow-x-auto shadow-sm border border-gray-200 rounded-lg mb-6">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
                                    <th className="p-4 border-b">Component of Work</th>
                                    <th className="p-4 border-b">Tooling</th>
                                    <th className="p-4 border-b">Granularity</th>
                                    <th className="p-4 border-b">Evidence Required</th>
                                    <th className="p-4 border-b w-20 text-center">Weight</th>
                                    <th className="p-4 border-b w-96">System Warnings</th>
                                </tr>
                            </thead>

                            <tbody className="bg-white">
                                {rows.map((row) => {
                                    const errors = getRowErrors(row);

                                    return (
                                        <tr
                                            key={row.id}
                                            className={`border-b transition-colors ${
                                                errors.length > 0 ? 'bg-red-50/50' : 'hover:bg-blue-50'
                                            }`}
                                        >
                                            <td className="p-3 border-r border-gray-100">
                                                <input
                                                    type="text"
                                                    value={row.component}
                                                    readOnly
                                                    className="w-full p-2 border border-gray-200 rounded text-sm font-medium text-gray-800 bg-gray-100 cursor-not-allowed"
                                                    title="Component names are fixed for this usability test."
                                                />
                                            </td>

                                            <td className="p-3 border-r border-gray-100">
                                                <select
                                                    value={row.tooling}
                                                    onChange={(e) => updateRow(row.id, 'tooling', e.target.value)}
                                                    className="w-full p-2 border border-gray-300 rounded text-sm bg-white"
                                                >
                                                    {toolingOptions.map(opt => <option key={opt}>{opt}</option>)}
                                                </select>
                                            </td>

                                            <td className="p-3 border-r border-gray-100">
                                                <select
                                                    value={row.granularity}
                                                    onChange={(e) => updateRow(row.id, 'granularity', e.target.value)}
                                                    className="w-full p-2 border border-gray-300 rounded text-sm bg-white"
                                                >
                                                    {granularityOptions.map(opt => <option key={opt}>{opt}</option>)}
                                                </select>
                                            </td>

                                            <td className="p-3 border-r border-gray-100">
                                                <select
                                                    value={row.evidence}
                                                    onChange={(e) => updateRow(row.id, 'evidence', e.target.value)}
                                                    className="w-full p-2 border border-gray-300 rounded text-sm bg-white"
                                                >
                                                    {evidenceOptions.map(opt => <option key={opt}>{opt}</option>)}
                                                </select>
                                            </td>

                                            <td className="p-3 border-r border-gray-100">
                                                <input
                                                    type="number"
                                                    value={row.weight}
                                                    onChange={(e) => updateRow(row.id, 'weight', e.target.value)}
                                                    className="w-full p-2 border border-gray-300 rounded text-center font-bold text-sm"
                                                />
                                            </td>

                                            <td className="p-3 text-sm">
                                                {errors.length === 0 ? (
                                                    <span className="text-green-600 font-semibold flex items-center text-xs">
                                                        <svg className="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"></path>
                                                        </svg>
                                                        Valid alignment
                                                    </span>
                                                ) : (
                                                    <div className="text-red-700 font-bold bg-red-100 p-2 rounded">
                                                        {errors.map((err, i) => (
                                                            <p key={i} className="text-xs flex items-start leading-tight mb-1 last:mb-0">
                                                                <span className="mr-1">⚠️</span>
                                                                {err}
                                                            </p>
                                                        ))}
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Total weight and publish state */}
                    <div className="flex justify-between items-center bg-gray-800 p-5 rounded-lg shadow-inner mb-8">
                        <div className="text-xl font-bold text-white">
                            Total Assessment Weight:
                            <span className={totalWeight === 100 ? "text-green-400 ml-3" : "text-red-400 ml-3"}>
                                {totalWeight}%
                            </span>
                        </div>

                        <button
                            className={`px-8 py-3 rounded-md text-white font-bold transition-all ${
                                canPublish
                                    ? 'bg-blue-600 hover:bg-blue-500 shadow-[0_0_15px_rgba(37,99,235,0.5)]'
                                    : 'bg-gray-600 cursor-not-allowed opacity-50'
                            }`}
                        >
                            {canPublish ? 'Matrix Valid' : 'Matrix Not Yet Valid'}
                        </button>
                    </div>

                    {/* Hidden stress-test section */}
                    <div className="bg-red-50 p-4 rounded-lg border border-red-200">
                        <div className="flex items-center justify-between gap-4">
                            <div>
                                <h2 className="text-sm font-bold text-red-800 uppercase tracking-wider">
                                    Optional: logic stress tests
                                </h2>
                                <p className="text-xs text-red-700 mt-1">
                                    These presets intentionally inject problematic configurations. Use them only when testing whether warnings are understandable.
                                </p>
                            </div>

                            <button
                                onClick={() => setShowStressTests(!showStressTests)}
                                className="px-4 py-2 bg-red-700 text-white text-sm font-bold rounded-md hover:bg-red-800 transition"
                                aria-expanded={showStressTests}
                            >
                                {showStressTests ? 'Hide stress tests' : 'Show stress tests'}
                            </button>
                        </div>

                        {showStressTests && (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4">
                                {Object.keys(errorCases).map(key => (
                                    <button
                                        key={key}
                                        onClick={() => applyPreset(key, true)}
                                        className={`p-3 rounded-md text-left transition-all duration-200 border-2 ${
                                            activePreset === `error-${key}`
                                                ? 'border-red-600 bg-white shadow-md'
                                                : 'border-red-100 bg-white shadow hover:border-red-400'
                                        }`}
                                    >
                                        <div className="font-bold text-red-700 text-sm">
                                            {errorCases[key].name}
                                        </div>
                                        <div className="text-xs text-gray-600 mt-1 leading-tight">
                                            {errorCases[key].desc}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WAMBuilder />);
    </script>
</body>
</html>
EOF
