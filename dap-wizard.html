<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAP - Progressive Disclosure UI</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-4 md:p-8 font-sans flex justify-center items-center min-h-screen">
    <div id="root" class="w-full max-w-3xl"></div>

    <script type="text/babel">
        const { useState } = React;

        /*
          Option ordering principle:

          Tooling:
          - least AI agency to most AI agency

          Granularity:
          - broadest disclosure level to finest disclosure level

          Evidence:
          - weakest evidence to strongest evidence
          - "AI-use label only (weak evidence)" remains separate from E1
          - It is placed before E1 because it is not stronger than E1/E2/E3/E4
        */

        const toolingOptions = [
            {
                label: 'Student Only',
                desc: 'The student completes this component without AI assistance.'
            },
            {
                label: 'Hybrid / Co-Pilot',
                desc: 'AI may assist, but the student remains responsible for judgment and verification.'
            },
            {
                label: 'AI Allowed',
                desc: 'AI use is permitted for this component, with suitable evidence of understanding.'
            }
        ];

        const evidenceOptions = [
            {
                id: 'AI_LABEL',
                label: 'AI-use label only (weak evidence)',
                desc: 'The student only declares AI use. This is weak because it does not prove understanding.'
            },
            {
                id: 'E1',
                label: 'E1: Final output only',
                desc: 'Only the final artifact is submitted. This is weak evidence when AI could produce the output.'
            },
            {
                id: 'E2',
                label: 'E2: Process evidence',
                desc: 'Process notes, tests, logs, raw data, drafts, or intermediate work.'
            },
            {
                id: 'E3',
                label: 'E3: Explanation evidence',
                desc: 'The student explains choices, reasoning, interpretation, or design rationale.'
            },
            {
                id: 'E4',
                label: 'E4: Live check',
                desc: 'A short oral check where the student explains specific choices or results.'
            }
        ];

        const profiles = {
            cs: {
                label: 'Computer Science / Software Design',
                shortLabel: 'Computer Science',
                desc: 'Software design, implementation, documentation, and debugging.',
                componentModel: 'The components follow a software development workflow.',
                components: [
                    {
                        label: 'System Architecture',
                        desc: 'Overall design, structure, and major system choices.'
                    },
                    {
                        label: 'Core Logic',
                        desc: 'Main reasoning, algorithmic, or functional part of the work.'
                    },
                    {
                        label: 'Syntax/Boilerplate',
                        desc: 'Routine code, formatting, or low-level implementation details.'
                    },
                    {
                        label: 'Documentation',
                        desc: 'Explanations, comments, README text, or written description.'
                    },
                    {
                        label: 'Debugging',
                        desc: 'Testing, fixing errors, and checking whether the output works.'
                    }
                ],
                granularityOptions: [
                    'Assignment-Level',
                    'Diagram-Level',
                    'File-Level',
                    'Function-Level',
                    'Line-Level'
                ]
            },

            bio: {
                label: 'Biological Science / Lab Report',
                shortLabel: 'Biological Science',
                desc: 'Experimental design, data integrity, analysis, and biological interpretation.',
                componentModel: 'The components follow a biological scientific inquiry workflow.',
                components: [
                    {
                        label: 'Background, Research Question & Hypothesis',
                        desc: 'Biological context, research question, and testable hypothesis.'
                    },
                    {
                        label: 'Experimental Design, Variables & Controls',
                        desc: 'Design choices, independent/dependent variables, controls, and confounders.'
                    },
                    {
                        label: 'Data Collection, Lab Notebook & Raw Observations',
                        desc: 'Raw observations, measurements, protocol notes, and lab notebook evidence.'
                    },
                    {
                        label: 'Data Analysis, Statistics & Figures',
                        desc: 'Data cleaning, statistical choices, graphs, tables, and analysis workflow.'
                    },
                    {
                        label: 'Discussion, Limitations & Scientific Argument',
                        desc: 'Biological interpretation, limitations, uncertainty, and evidence-based claims.'
                    }
                ],
                granularityOptions: [
                    'Whole-Report Level',
                    'Section-Level',
                    'Source-Level',
                    'Claim-Level',
                    'Figure/Table Level',
                    'Protocol-Step Level',
                    'Observation/Data-Point Level'
                ]
            }
        };

        function DAPWizard() {
            const totalSteps = 6;

            const [activeDomain, setActiveDomain] = useState('cs');
            const [step, setStep] = useState(1);

            const [data, setData] = useState({
                component: '',
                tooling: '',
                granularity: '',
                weight: 50,
                evidence: ''
            });

            const profile = profiles[activeDomain];

            const resetWizard = () => {
                setData({
                    component: '',
                    tooling: '',
                    granularity: '',
                    weight: 50,
                    evidence: ''
                });
                setStep(1);
            };

            const switchDomain = (domainKey) => {
                setActiveDomain(domainKey);
                setData({
                    component: '',
                    tooling: '',
                    granularity: '',
                    weight: 50,
                    evidence: ''
                });
                setStep(1);
            };

            const nextStep = () => setStep(step + 1);
            const prevStep = () => setStep(step - 1);

            const isAIPermitted = () => {
                return data.tooling === 'Hybrid / Co-Pilot' || data.tooling === 'AI Allowed';
            };

            const isWeakEvidenceLabel = (label) => {
                return label === 'AI-use label only (weak evidence)' || label === 'E1: Final output only';
            };

            const getComponentFlags = () => {
                const compLower = data.component.toLowerCase();

                return {
                    isArchitecture:
                        compLower.includes('architecture'),

                    isBackground:
                        compLower.includes('background') ||
                        compLower.includes('hypothesis'),

                    isExperimentalDesign:
                        compLower.includes('experimental design') ||
                        compLower.includes('variables') ||
                        compLower.includes('controls'),

                    isDataCollection:
                        compLower.includes('data collection') ||
                        compLower.includes('lab notebook') ||
                        compLower.includes('raw observations'),

                    isDataAnalysis:
                        compLower.includes('data analysis') ||
                        compLower.includes('statistics') ||
                        compLower.includes('figures'),

                    isDiscussion:
                        compLower.includes('discussion') ||
                        compLower.includes('limitations') ||
                        compLower.includes('scientific argument')
                };
            };

            const getAvailableGranularity = () => {
                const flags = getComponentFlags();

                return profile.granularityOptions.map(label => {
                    let disabled = false;
                    let reason = '';

                    if (
                        activeDomain === 'cs' &&
                        flags.isArchitecture &&
                        label === 'Line-Level'
                    ) {
                        disabled = true;
                        reason = 'Disabled: system architecture is a big-picture task. Line-level disclosure is too detailed.';
                    }

                    if (
                        activeDomain === 'bio' &&
                        (flags.isDataCollection || flags.isDataAnalysis) &&
                        label === 'Whole-Report Level'
                    ) {
                        disabled = true;
                        reason = 'Disabled: data work needs more specific evidence than whole-report-level disclosure.';
                    }

                    if (
                        activeDomain === 'bio' &&
                        (flags.isBackground || flags.isExperimentalDesign || flags.isDiscussion) &&
                        label === 'Observation/Data-Point Level'
                    ) {
                        disabled = true;
                        reason = 'Disabled: this is a big-picture reasoning task. Data-point-level disclosure is too microscopic.';
                    }

                    return {
                        label,
                        disabled,
                        reason
                    };
                });
            };

            const getAvailableEvidence = () => {
                const flags = getComponentFlags();

                return evidenceOptions.map(opt => {
                    let disabled = false;
                    let reason = '';

                    const isWeak = isWeakEvidenceLabel(opt.label);

                    // Universal DAP rule: high weight + AI permitted + weak evidence
                    if (
                        data.weight >= 25 &&
                        isAIPermitted() &&
                        isWeak
                    ) {
                        disabled = true;
                        reason = 'Disabled: this task is worth many points and AI is allowed. Weak evidence is not enough. Ask for process evidence, explanation evidence, or a live check.';
                    }

                    // Universal DAP rule: low weight + heavy evidence
                    if (
                        data.weight <= 10 &&
                        (opt.id === 'E3' || opt.id === 'E4')
                    ) {
                        disabled = true;
                        reason = 'Disabled: this task is worth few points. Heavy evidence may create too much work for a small part of the grade.';
                    }

                    // Biology-specific: data integrity
                    if (
                        activeDomain === 'bio' &&
                        (flags.isDataCollection || flags.isDataAnalysis) &&
                        data.weight >= 15 &&
                        isWeak
                    ) {
                        disabled = true;
                        reason = 'Disabled: important data work should not be assessed only through an AI-use label or final output. Ask for raw data, lab notebook notes, analysis files, or process evidence.';
                    }

                    // Biology-specific: experimental design with AI
                    if (
                        activeDomain === 'bio' &&
                        flags.isExperimentalDesign &&
                        isAIPermitted() &&
                        isWeak
                    ) {
                        disabled = true;
                        reason = 'Disabled: experimental design requires justification of variables, controls, and confounders. Weak evidence is not enough when AI support is allowed.';
                    }

                    // Biology-specific: source quality risk
                    if (
                        activeDomain === 'bio' &&
                        flags.isBackground &&
                        isAIPermitted() &&
                        data.weight >= 10 &&
                        opt.label === 'AI-use label only (weak evidence)'
                    ) {
                        disabled = true;
                        reason = 'Disabled: for biological background work, an AI-use label alone does not show source quality or understanding.';
                    }

                    return {
                        ...opt,
                        disabled,
                        reason
                    };
                });
            };

            const getFinalWarnings = () => {
                const flags = getComponentFlags();
                const warnings = [];

                if (
                    activeDomain === 'bio' &&
                    flags.isDataCollection &&
                    data.tooling === 'AI Allowed'
                ) {
                    warnings.push(
                        'For raw observations or measurements, clarify that AI may assist with formatting, transcription, or reflection, but should not replace the student’s direct observation.'
                    );
                }

                return warnings;
            };

            const finalWarnings = getFinalWarnings();

            return (
                <div className="bg-white p-6 md:p-8 rounded-xl shadow-2xl">
                    {/* Header */}
                    <div className="mb-6 border-b pb-4">
                        <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">
                                    DAP Component Builder
                                </h1>
                                <p className="text-gray-500 text-sm mt-1">
                                    Interface B: Progressive Disclosure Wizard
                                </p>
                            </div>

                            <div className="text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200 px-3 py-2 rounded-full self-start">
                                {profile.shortLabel}
                            </div>
                        </div>

                        <p className="text-gray-600 text-sm mt-3 leading-relaxed">
                            This wizard builds one assessment component step by step. It uses the same DAP/WAM logic as the matrix builder.
                            Evidence means proof that the student understands the submitted work.
                        </p>

                        {/* Context Selector */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-4">
                            {Object.keys(profiles).map(key => (
                                <button
                                    key={key}
                                    onClick={() => switchDomain(key)}
                                    className={`p-3 rounded-lg border-2 text-left transition-all ${
                                        activeDomain === key
                                            ? 'border-blue-600 bg-blue-50'
                                            : 'border-gray-200 bg-white hover:border-blue-300'
                                    }`}
                                >
                                    <div className="font-bold text-sm text-gray-800">
                                        {profiles[key].label}
                                    </div>
                                    <div className="text-xs text-gray-500 mt-1">
                                        {profiles[key].desc}
                                    </div>
                                </button>
                            ))}
                        </div>

                        {/* Progress Bar */}
                        <div className="flex mt-4 space-x-2">
                            {[1, 2, 3, 4, 5, 6].map(i => (
                                <div
                                    key={i}
                                    className={`h-2 flex-1 rounded ${step >= i ? 'bg-blue-600' : 'bg-gray-200'}`}
                                ></div>
                            ))}
                        </div>
                    </div>

                    {/* Step 1: Component */}
                    {step === 1 && (
                        <div className="animate-fade-in">
                            <h2 className="text-xl font-bold mb-2">
                                Step 1: What are you grading?
                            </h2>

                            <p className="text-gray-600 text-sm mb-4">
                                Select one assignment component for the current context: <span className="font-bold">{profile.label}</span>.
                            </p>

                            <div className="space-y-3">
                                {profile.components.map(opt => (
                                    <button
                                        key={opt.label}
                                        onClick={() => {
                                            setData({
                                                ...data,
                                                component: opt.label,
                                                tooling: '',
                                                granularity: '',
                                                evidence: ''
                                            });
                                            nextStep();
                                        }}
                                        className={`w-full p-4 border-2 rounded-lg text-left transition-all ${
                                            data.component === opt.label
                                                ? 'border-blue-600 bg-blue-50'
                                                : 'border-gray-200 hover:border-blue-400 bg-white'
                                        }`}
                                    >
                                        <div className="text-lg font-bold text-gray-800">
                                            {opt.label}
                                        </div>
                                        <div className="text-sm text-gray-500 mt-1">
                                            {opt.desc}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Step 2: Tooling */}
                    {step === 2 && (
                        <div className="animate-fade-in">
                            <h2 className="text-xl font-bold mb-2">
                                Step 2: What is the AI policy?
                            </h2>

                            <p className="text-gray-600 text-sm mb-4">
                                Component: <span className="font-bold">{data.component}</span>
                            </p>

                            <div className="space-y-3">
                                {toolingOptions.map(opt => (
                                    <button
                                        key={opt.label}
                                        onClick={() => {
                                            setData({
                                                ...data,
                                                tooling: opt.label,
                                                evidence: ''
                                            });
                                            nextStep();
                                        }}
                                        className={`w-full p-4 border-2 rounded-lg text-left transition-all ${
                                            data.tooling === opt.label
                                                ? 'border-blue-600 bg-blue-50'
                                                : 'border-gray-200 hover:border-blue-400 bg-white'
                                        }`}
                                    >
                                        <div className="text-lg font-bold text-gray-800">
                                            {opt.label}
                                        </div>
                                        <div className="text-sm text-gray-500 mt-1">
                                            {opt.desc}
                                        </div>
                                    </button>
                                ))}
                            </div>

                            <button
                                onClick={prevStep}
                                className="mt-4 text-gray-500 font-medium hover:text-gray-800"
                            >
                                ← Back
                            </button>
                        </div>
                    )}

                    {/* Step 3: Granularity */}
                    {step === 3 && (
                        <div className="animate-fade-in">
                            <h2 className="text-xl font-bold mb-2">
                                Step 3: Disclosure Granularity
                            </h2>

                            <p className="text-gray-600 text-sm mb-4">
                                Choose the level at which students should disclose or evidence their work.
                            </p>

                            <div className="space-y-3">
                                {getAvailableGranularity().map(opt => (
                                    <div key={opt.label}>
                                        <button
                                            onClick={() => {
                                                setData({
                                                    ...data,
                                                    granularity: opt.label,
                                                    evidence: ''
                                                });
                                                nextStep();
                                            }}
                                            disabled={opt.disabled}
                                            className={`w-full p-4 border-2 rounded-lg text-left text-lg font-medium transition-all ${
                                                opt.disabled
                                                    ? 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed'
                                                    : data.granularity === opt.label
                                                        ? 'border-blue-600 bg-blue-50 text-gray-800'
                                                        : 'border-gray-200 hover:border-blue-400 text-gray-800 bg-white'
                                            }`}
                                        >
                                            {opt.label}
                                        </button>

                                        {opt.disabled && (
                                            <p className="text-xs text-red-600 mt-1 ml-2 leading-relaxed">
                                                🔒 {opt.reason}
                                            </p>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <button
                                onClick={prevStep}
                                className="mt-4 text-gray-500 font-medium hover:text-gray-800"
                            >
                                ← Back
                            </button>
                        </div>
                    )}

                    {/* Step 4: Weight */}
                    {step === 4 && (
                        <div className="animate-fade-in">
                            <h2 className="text-xl font-bold mb-2">
                                Step 4: Grading Weight
                            </h2>

                            <p className="text-gray-600 mb-4">
                                How much of the final grade is this component worth?
                            </p>

                            <div className="flex items-center space-x-4">
                                <input
                                    type="range"
                                    min="5"
                                    max="100"
                                    step="5"
                                    value={data.weight}
                                    onChange={e => setData({
                                        ...data,
                                        weight: Number(e.target.value),
                                        evidence: ''
                                    })}
                                    className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                                />

                                <span className="text-3xl font-bold text-blue-600 w-20 text-right">
                                    {data.weight}%
                                </span>
                            </div>

                            <div className="flex space-x-4 mt-8">
                                <button
                                    onClick={prevStep}
                                    className="px-6 py-3 bg-gray-200 text-gray-700 font-bold rounded-lg hover:bg-gray-300"
                                >
                                    ← Back
                                </button>

                                <button
                                    onClick={nextStep}
                                    className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700"
                                >
                                    Next Step →
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Step 5: Evidence */}
                    {step === 5 && (
                        <div className="animate-fade-in">
                            <h2 className="text-xl font-bold mb-2">
                                Step 5: Evidence Required
                            </h2>

                            <p className="text-sm text-gray-500 mb-4 leading-relaxed">
                                Based on your choices —
                                <span className="font-bold text-blue-600"> {data.tooling}</span>,
                                <span className="font-bold text-blue-600"> {data.granularity}</span>, and
                                <span className="font-bold text-blue-600"> {data.weight}% weight</span> —
                                the wizard filters evidence options. Disabled options are inconsistent or disproportionate.
                            </p>

                            <div className="space-y-3">
                                {getAvailableEvidence().map(opt => (
                                    <div key={opt.id}>
                                        <button
                                            onClick={() => {
                                                setData({
                                                    ...data,
                                                    evidence: opt.label
                                                });
                                                nextStep();
                                            }}
                                            disabled={opt.disabled}
                                            className={`w-full p-4 border-2 rounded-lg text-left transition-all ${
                                                opt.disabled
                                                    ? 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed'
                                                    : data.evidence === opt.label
                                                        ? 'border-blue-600 bg-blue-50 text-gray-800'
                                                        : 'border-gray-200 hover:border-blue-400 text-gray-800 bg-white'
                                            }`}
                                        >
                                            <div className="text-lg font-bold">
                                                {opt.label}
                                            </div>
                                            <div className="text-sm mt-1 opacity-80">
                                                {opt.desc}
                                            </div>
                                        </button>

                                        {opt.disabled && (
                                            <p className="text-xs text-red-600 mt-1 ml-2 leading-relaxed">
                                                🔒 {opt.reason}
                                            </p>
                                        )}
                                    </div>
                                ))}
                            </div>

                            <button
                                onClick={prevStep}
                                className="mt-4 text-gray-500 font-medium hover:text-gray-800"
                            >
                                ← Back
                            </button>
                        </div>
                    )}

                    {/* Step 6: Summary */}
                    {step === 6 && (
                        <div className="animate-fade-in text-center py-6">
                            <div className="text-green-500 text-5xl mb-4">✓</div>

                            <h2 className="text-2xl font-bold text-gray-800 mb-2">
                                Component Completed
                            </h2>

                            <p className="text-gray-600 mb-6">
                                This component satisfies the current DAP/WAM filtering rules.
                            </p>

                            <div className="bg-gray-50 p-4 rounded-lg text-left border border-gray-200 mb-4 space-y-1 text-sm">
                                <p><strong>Context:</strong> {profile.label}</p>
                                <p><strong>Component:</strong> {data.component}</p>
                                <p><strong>Tooling:</strong> {data.tooling}</p>
                                <p><strong>Granularity:</strong> {data.granularity}</p>
                                <p><strong>Weight:</strong> {data.weight}%</p>
                                <p><strong>Evidence:</strong> {data.evidence}</p>
                            </div>

                            {finalWarnings.length > 0 && (
                                <div className="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-3 text-left text-sm mb-5">
                                    <div className="font-bold mb-1">Advisory note</div>
                                    {finalWarnings.map((warning, index) => (
                                        <p key={index}>{warning}</p>
                                    ))}
                                </div>
                            )}

                            <button
                                onClick={resetWizard}
                                className="text-blue-600 font-bold hover:underline"
                            >
                                Build Another Component
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DAPWizard />);
    </script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body>
</html>
